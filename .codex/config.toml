

[mcp_servers.aseprite-ai-artist]
command = "powershell.exe"
args = [
  "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$relative = '.claude/skills/aseprite-ai-artist/start-mcp.ps1'
  $candidates = @($relative, (Join-Path 'Demon Lord Roguelike' $relative))
  $launcher = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
  if (-not $launcher) { throw 'The project Aseprite AI Artist launcher was not found.' }
  & (Resolve-Path -LiteralPath $launcher).Path
  exit $LASTEXITCODE
  '''
]
startup_timeout_sec = 30
